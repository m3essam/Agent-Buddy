<!doctype html>
<html><body>
<video id="v" muted></video>
<script src="../renderer/extract-core.js"></script>
<script>
// Command-line cutter (see extract.js): plain-colour background, same core as the in-app video wizard.
const { ipcRenderer } = require('electron');
const FPS = 10, OUT_H = 512, TOLERANCE = 0.17;

const v = document.getElementById('v');
const seek = (t) => new Promise((r) => { v.onseeked = r; v.currentTime = t; });

(async () => {
  v.src = new URLSearchParams(location.search).get('src');
  await new Promise((r, j) => { v.onloadeddata = r; v.onerror = () => j(new Error('cannot decode video')); });
  const W = v.videoWidth, H = v.videoHeight, count = Math.floor(v.duration * FPS);
  const full = Object.assign(document.createElement('canvas'), { width: W, height: H });
  const fx = full.getContext('2d', { willReadFrequently: true });

  // Pass 1: key every frame and remember the figure's widest extent, so no pose is cut off.
  await seek(0.02); fx.drawImage(v, 0, 0);
  const bg = cornerBackground(fx.getImageData(0, 0, W, H));
  const keyed = [];
  let bounds = null;
  for (let i = 0; i < count; i++) {
    await seek(i / FPS + 0.02);
    fx.clearRect(0, 0, W, H); fx.drawImage(v, 0, 0);
    const im = keyColour(fx.getImageData(0, 0, W, H), bg, TOLERANCE);
    bounds = unionBounds(bounds, alphaBounds(im));
    fx.putImageData(im, 0, 0);
    keyed.push(await new Promise((r) => full.toBlob(r, 'image/webp', 0.95))); // compressed, so long clips fit in memory
  }
  if (!bounds) return ipcRenderer.send('fail', 'No figure found in the video');
  const crop = cropRect(bounds, W, H), OH = Math.min(OUT_H, crop.h), OW = Math.round(crop.w * OH / crop.h);
  ipcRenderer.send('log', `video ${W}x${H}, ${v.duration.toFixed(1)}s, figure ${crop.w}x${crop.h} -> ${OW}x${OH}`);

  // Pass 2: crop and scale each keyed frame.
  const o = Object.assign(document.createElement('canvas'), { width: OW, height: OH });
  const ox = o.getContext('2d');
  ox.imageSmoothingQuality = 'high';
  for (let i = 0; i < count; i++) {
    ox.clearRect(0, 0, OW, OH);
    const bmp = await createImageBitmap(keyed[i]);
    ox.drawImage(bmp, crop.x, crop.y, crop.w, crop.h, 0, 0, OW, OH);
    bmp.close();
    const blob = await new Promise((r) => o.toBlob(r, 'image/webp', 0.9));
    ipcRenderer.send('frame', i, new Uint8Array(await blob.arrayBuffer()));
  }
  ipcRenderer.send('done', { count, width: OW, height: OH, fps: FPS });
})().catch((e) => ipcRenderer.send('fail', String(e)));
</script>
</body></html>
