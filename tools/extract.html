<!doctype html>
<html><body>
<video id="v" muted></video>
<script>
const { ipcRenderer } = require('electron');
const FPS = 10;
const REF_WIDTH = 1068, REF_SCALE = 0.5; // the idle recording: 1068px wide, frames at half size
const PAD = 12, LO = 8, HI = 40;          // flood-fill thresholds (sum of RGB distance from the background)

const v = document.getElementById('v');
const seek = (t) => new Promise((r) => { v.onseeked = r; v.currentTime = t; });

(async () => {
  v.src = new URLSearchParams(location.search).get('src');
  await new Promise((r, j) => { v.onloadeddata = r; v.onerror = () => j(new Error('cannot decode video')); });
  const W = v.videoWidth, H = v.videoHeight;
  const full = Object.assign(document.createElement('canvas'), { width: W, height: H });
  const fx = full.getContext('2d', { willReadFrequently: true });

  // Background colour from a point at the right edge, mid-height.
  await seek(0.1); fx.drawImage(v, 0, 0);
  const bgPx = fx.getImageData(W - 8, H >> 1, 1, 1).data;
  const bg = [bgPx[0], bgPx[1], bgPx[2]];
  const dist = (d, i) => Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]);

  // Bounding box of the figure across the clip, skipping the mood label at the top.
  const skipTop = Math.round(H * 100 / 1292);
  let minX = W, minY = H, maxX = 0, maxY = 0;
  // every output frame, so the widest stride of the running poses is inside the crop
  for (let k = 0; k < Math.floor(v.duration * FPS); k++) {
    await seek(k / FPS + 0.02); fx.drawImage(v, 0, 0);
    const d = fx.getImageData(0, 0, W, H).data;
    for (let y = skipTop; y < H; y += 2) for (let x = 0; x < W; x += 2) {
      if (dist(d, (y * W + x) * 4) > 45) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
  }
  if (maxX <= minX) return ipcRenderer.send('fail', 'No figure found in the video');
  const X0 = Math.max(0, minX - PAD), Y0 = Math.max(0, minY - PAD);
  const CW = Math.min(W, maxX + PAD) - X0, CH = Math.min(H, maxY + PAD) - Y0;
  const S = REF_SCALE * REF_WIDTH / W, OW = Math.round(CW * S), OH = Math.round(CH * S);
  ipcRenderer.send('log', `video ${W}x${H}, ${v.duration.toFixed(1)}s, figure ${CW}x${CH} -> ${OW}x${OH}`);

  const c = Object.assign(document.createElement('canvas'), { width: CW, height: CH });
  const cx = c.getContext('2d', { willReadFrequently: true });
  const o = Object.assign(document.createElement('canvas'), { width: OW, height: OH });
  const ox = o.getContext('2d');
  ox.imageSmoothingQuality = 'high';

  const count = Math.floor(v.duration * FPS);
  for (let i = 0; i < count; i++) {
    await seek(i / FPS + 0.02);
    cx.drawImage(v, X0, Y0, CW, CH, 0, 0, CW, CH);
    const im = cx.getImageData(0, 0, CW, CH), d = im.data, N = CW * CH;
    const diff = new Float32Array(N), seen = new Uint8Array(N);
    for (let p = 0; p < N; p++) diff[p] = dist(d, p * 4);
    // Flood-fill the background in from the edges so light clothing inside the figure survives.
    const st = [];
    for (let x = 0; x < CW; x++) st.push(x, (CH - 1) * CW + x);
    for (let y = 0; y < CH; y++) st.push(y * CW, y * CW + CW - 1);
    while (st.length) {
      const p = st.pop();
      if (seen[p] || diff[p] > HI) continue;
      seen[p] = 1;
      if (diff[p] <= LO) {
        const x = p % CW, y = (p / CW) | 0;
        if (x > 0) st.push(p - 1); if (x < CW - 1) st.push(p + 1);
        if (y > 0) st.push(p - CW); if (y < CH - 1) st.push(p + CW);
      }
    }
    for (let p = 0; p < N; p++) {
      if (!seen[p]) continue;
      if (diff[p] <= LO) { d[p * 4 + 3] = 0; continue; }
      // Edge pixel: set partial alpha and remove the background's share of its colour (no light halo).
      const a = (diff[p] - LO) / (HI - LO);
      for (let ch = 0; ch < 3; ch++) d[p * 4 + ch] = Math.max(0, Math.min(255, (d[p * 4 + ch] - bg[ch] * (1 - a)) / a));
      d[p * 4 + 3] = Math.round(255 * a);
    }
    // The figure's outermost ring still blends into the background: soften it with a wider range.
    const RING_HI = 120;
    for (let p = 0; p < N; p++) {
      if (seen[p]) continue;
      const x = p % CW, y = (p / CW) | 0;
      const edge = (x > 0 && seen[p - 1]) || (x < CW - 1 && seen[p + 1]) || (y > 0 && seen[p - CW]) || (y < CH - 1 && seen[p + CW]);
      if (!edge || diff[p] >= RING_HI) continue;
      const a = Math.max(0.05, (diff[p] - LO) / (RING_HI - LO));
      for (let ch = 0; ch < 3; ch++) d[p * 4 + ch] = Math.max(0, Math.min(255, (d[p * 4 + ch] - bg[ch] * (1 - a)) / a));
      d[p * 4 + 3] = Math.round(255 * a);
    }
    cx.putImageData(im, 0, 0);
    ox.clearRect(0, 0, OW, OH);
    ox.drawImage(c, 0, 0, OW, OH);
    const blob = await new Promise((r) => o.toBlob(r, 'image/webp', 0.9));
    ipcRenderer.send('frame', i, new Uint8Array(await blob.arrayBuffer()));
  }
  ipcRenderer.send('done', { count, width: OW, height: OH, fps: FPS });
})().catch((e) => ipcRenderer.send('fail', String(e)));
</script>
</body></html>
