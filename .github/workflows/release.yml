# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
# Installed copies update themselves from these releases (electron-updater reads latest.yml).
#   1. bump "version" in package.json and commit
#   2. git tag v<version> && git push origin v<version>
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
