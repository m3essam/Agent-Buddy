# Checks that every pull request still parses and packages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in *.js renderer/*.js tools/*.js; do node --check "$f" || exit 1; done
      - name: Package (no installer, nothing published)
        run: npx electron-builder --win dir --publish never
